general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl eval 'monitors_resume()'  # full dpms cycle + renderer reload, see hyprland.lua (Lua config: old `dispatch dpms on` syntax fails).
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener { 
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'   # screen off when timeout has passed (Lua dispatch syntax)
    on-resume = hyprctl eval 'monitors_wake()'; brightnessctl -r       # screen on + renderer reload when activity is detected.
}

listener {
    timeout = 420                                 # 7min
    on-timeout = systemctl suspend                # suspend pc
}
